[project]
name = "betting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=1.0.0",
    "openai>=1.0.0",
    "ddgs>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.11.0,<3.0.0",
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

# Third-party runtime dependencies without bundled type stubs. Silences
# import-not-found noise when mypy runs in an isolated environment.
[[tool.mypy.overrides]]
module = ["agno.*", "openai.*"]
ignore_missing_imports = true
